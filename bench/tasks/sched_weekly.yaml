id: sched_weekly
title_fa: "یادآور هفتگی"
category: scheduling
prompt: "هر هفته شنبه‌ها ساعت ۱۰ صبح یک یادآوری با متن «خرید هفتگی» بگذار."
scoring:
  type: tool_args
  expected_tools: [remind_at]
